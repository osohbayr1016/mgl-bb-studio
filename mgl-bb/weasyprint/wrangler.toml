# Dedicated Worker that runs the WeasyPrint HTML->PDF container. Deployed on its
# own (NOT part of the MGL backend deploy) so MGL's CI and DO-migration list are
# untouched. Requires the Workers Paid plan, and Docker running wherever you run
# `wrangler deploy` (Wrangler builds + pushes the image).
name = "mgl-weasyprint"
main = "src/index.ts"
compatibility_date = "2025-05-01"
# Must be the SAME account as the MGL backend Worker, or the WEASYPRINT_SVC
# service binding from MGL will not resolve (bindings are account-scoped).
account_id = "a01b2b194850c45387e7035eb9ebaca6"

# The container image + instance size. basic = 1 GiB / 0.25 vCPU — ample for
# WeasyPrint (Pango/Cairo HTML->PDF; no headless browser). Bump to standard-1
# if you render very large documents. Containers scale to zero when idle, so
# you only pay for active seconds.
[[containers]]
class_name = "WeasyPrintContainer"
image = "./Dockerfile"
instance_type = "basic"
max_instances = 3

# Each container instance is fronted by a Durable Object (the Container class).
[[durable_objects.bindings]]
name = "WEASYPRINT"
class_name = "WeasyPrintContainer"

# Container-backed DOs must use new_sqlite_classes (append-only history).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WeasyPrintContainer"]
