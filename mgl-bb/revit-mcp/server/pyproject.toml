[project]
name = "revit-mcp"
version = "0.1.0"
description = "MCP server bridging Claude to Revit 2027 via a local HTTP add-in"
requires-python = ">=3.10"
dependencies = [
    # ⚠️ 2.x-д ТОГТООХГҮЙ.  mcp 2.0 нь `mcp.server.fastmcp`-ыг УСТГАСАН
    # (шинэ нэр нь `mcp.server.mcpserver`), тул `server.py` шууд унана.
    # Порт хийх хүртэл 1.x дээр байна.
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
revit-mcp = "revit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revit_mcp"]
