<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d11" />
    <title>Холболт тасарсан — %VITE_ORG_NAME_SHORT%</title>
    <!--
      Served by the service worker when a navigation fails and no cached
      index.html exists.  MUST be fully self-contained: no external CSS, no
      web fonts, no <img src>, no script src — by definition nothing else is
      reachable when this page is shown.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #0d0d11;
        color: #e9e9ee;
        font-family:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
          Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 340px;
        width: 100%;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 28px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #ffffff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 600;
        line-height: 1.35;
        color: #ffffff;
      }
      p {
        margin: 0 0 28px;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(233, 233, 238, 0.62);
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        width: 100%;
        padding: 12px 20px;
        border-radius: 10px;
        background: #ffffff;
        color: #0d0d11;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        transition:
          opacity 0.15s ease,
          transform 0.1s ease;
      }
      button:hover {
        opacity: 0.88;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin: 18px 0 0;
        font-size: 12px;
        color: rgba(233, 233, 238, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">%VITE_ORG_NAME_SHORT%</div>
      <h1>Холболт тасарсан байна</h1>
      <p>Интернэт холболтоо шалгаад дахин оролдоно уу.</p>
      <button type="button" onclick="location.reload()">Дахин оролдох</button>
      <p class="hint">Холболт сэргэмэгц апп автоматаар ажиллана.</p>
    </div>
  </body>
</html>
